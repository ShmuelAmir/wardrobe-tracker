# The suite is in-memory and deploys are run by hand (§14.6), so this workflow
# needs no secrets at all (§15.6). Anything added here that wants one is a
# change of policy, not a change of config.
#
# Two jobs, because there are two packages: the native app at the root and the
# Vite app in `web/`, each with its own dependency tree. They run in parallel and
# both have to be green — that is the coexistence window's whole contract, that
# there is never a moment when nothing guards the tree (§15.1).
name: CI

on: push

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The build is a check in its own right: it is the only step that proves
      # `@` still resolves the shipped domain modules into a browser bundle.
      - run: npm run build
